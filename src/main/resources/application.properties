# ===================================================================
# LUXORA — Smart Hotel Management & Hospitality System Configuration
# ===================================================================

# Application Configuration
spring.application.name=luxora-hotel-management
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${LUXORA_SESSION_COOKIE_SECURE:false}

# Spring MVC Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# ===================================================================
# DATABASE CONFIGURATION (MySQL + Spring Data JPA + Hibernate)
# ===================================================================
spring.datasource.url=${LUXORA_DB_URL:jdbc:mysql://localhost:3306/luxora_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${LUXORA_DB_USERNAME:luxora}
spring.datasource.password=${LUXORA_DB_PASSWORD:changeMe}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Production-friendly defaults
spring.jpa.open-in-view=false

# Optional first-run administrator account. Leave unset to disable bootstrap.
luxora.bootstrap-admin.email=${LUXORA_ADMIN_EMAIL:}
luxora.bootstrap-admin.password=${LUXORA_ADMIN_PASSWORD:}
luxora.bootstrap-admin.first-name=${LUXORA_ADMIN_FIRST_NAME:Luxora}
luxora.bootstrap-admin.last-name=${LUXORA_ADMIN_LAST_NAME:Administrator}
